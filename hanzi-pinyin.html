<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>汉字转拼音</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        label {
            display: block;
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
        }
        #input {
            width: 150px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 48px;
            font-family: inherit;
            text-align: center;
            transition: border-color 0.3s;
        }
        #input:focus {
            outline: none;
            border-color: #667eea;
        }
        .options {
            display: flex;
            gap: 20px;
            margin: 20px 0;
            flex-wrap: wrap;
            justify-content: center;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .results-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .result-box, .stroke-box {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            min-width: 250px;
            flex: 1;
        }
        .result-label, .stroke-label {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .result {
            font-size: 32px;
            color: #333;
            font-weight: bold;
        }
        .placeholder {
            color: #999;
            font-style: italic;
        }
        .typing {
            color: #667eea;
            font-style: italic;
        }
        .grid-container {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #character-target {
            width: 200px;
            height: 200px;
        }
        .grid {
            position: absolute;
            width: 200px;
            height: 200px;
            pointer-events: none;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        .grid-line {
            position: absolute;
            background-color: #ddd;
        }
        .grid-line-h-h1 {
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
        }
        .grid-line-h-h2 {
            top: 0;
            left: 50%;
            width: 1px;
            height: 100%;
        }
        .grid-border {
            border: 2px solid #333;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>汉字转拼音</h1>

        <label for="input">输入汉字：</label>
        <input type="text" id="input" placeholder="字" maxlength="1">

        <div class="options">
            <label class="option">
                <input type="checkbox" id="heteronym"> 多音字
            </label>
        </div>

        <div class="results-container">
            <div class="result-box">
                <div class="result-label">拼音：</div>
                <div id="result" class="result placeholder">加载中...</div>
            </div>

            <div class="stroke-box">
                <div class="stroke-label">笔画书写：</div>
                <div class="grid-container">
                    <div id="character-target"></div>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer/dist/hanzi-writer.min.js"></script>
    <script>
        const input = document.getElementById('input');
        const result = document.getElementById('result');
        const heteronym = document.getElementById('heteronym');
        let typingTimer = null;
        let writer = null;
        let animationInterval = null;

        // Draw Tian Zi Ge (田字格)
        function drawGrid() {
            const container = document.querySelector('.grid-container');
            const existingGrid = container.querySelector('.grid');
            if (existingGrid) {
                existingGrid.remove();
            }
            const grid = document.createElement('div');
            grid.className = 'grid';
            grid.innerHTML = `
                <div class="grid-border"></div>
                <div class="grid-line grid-line-h-h1"></div>
                <div class="grid-line grid-line-h-h2"></div>
            `;
            container.appendChild(grid);
        }

        // Initialize HanziWriter
        function initWriter(char) {
            // Clear existing writer and animation
            if (writer) {
                writer.cancelQuiz();
                writer = null;
            }
            if (animationInterval) {
                clearInterval(animationInterval);
                animationInterval = null;
            }

            // Clear the canvas
            const container = document.getElementById('character-target');
            container.innerHTML = '';

            // Create new writer
            writer = HanziWriter.create('character-target', char, {
                width: 200,
                height: 200,
                padding: 5,
                strokeAnimationSpeed: 300,
                delayBetweenStrokes: 200,
                showCharacter: false,
                showOutline: true,
                outlineColor: '#ddd',
                strokeColor: '#333',
                radicalColor: '#667eea',
                grid: {
                    show: false
                }
            });

            // Start loop animation
            startLoopAnimation();
        }

        // Start loop animation
        function startLoopAnimation() {
            if (animationInterval) {
                clearInterval(animationInterval);
            }

            animationInterval = setInterval(() => {
                if (writer) {
                    writer.animateCharacter().then(() => {
                        setTimeout(() => {
                            writer.hideCharacter();
                        }, 1000);
                    });
                }
            }, 3500);

            // First animation
            if (writer) {
                writer.animateCharacter().then(() => {
                    setTimeout(() => {
                        writer.hideCharacter();
                    }, 1000);
                });
            }
        }

        // Convert character to pinyin
        function convert() {
            const text = input.value.trim();
            if (!text) {
                result.innerHTML = '<span class="placeholder">等待输入...</span>';
                if (writer) {
                    writer.cancelQuiz();
                    writer = null;
                }
                if (animationInterval) {
                    clearInterval(animationInterval);
                    animationInterval = null;
                }
                const container = document.getElementById('character-target');
                container.innerHTML = '';
                return;
            }

            const char = text[0];

            try {
                let py;

                py = pinyinPro.pinyin(char, {
                    toneType: 'symbol',
                    type: heteronym.checked ? 'array' : 'string'
                });

                if (py && py.length > 0) {
                    const resultText = Array.isArray(py) ? py.join('/') : py;
                    result.textContent = resultText;
                } else {
                    result.textContent = '未找到拼音';
                }

                // Initialize stroke animation
                initWriter(char);

            } catch (e) {
                result.textContent = '转换出错: ' + e.message;
                console.error('Error:', e);
            }
        }

        input.addEventListener('input', () => {
            clearTimeout(typingTimer);
            if (input.value.trim()) {
                result.innerHTML = '<span class="typing">正在输入...</span>';
                typingTimer = setTimeout(convert, 300);
            } else {
                convert();
            }
        });
        heteronym.addEventListener('change', convert);

        // Initialize
        setTimeout(() => {
            result.innerHTML = '<span class="placeholder">等待输入...</span>';
            drawGrid();
        }, 100);
    </script>
</body>
</html>
