<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>舒尔特方格 - 注意力训练</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        h1 {
            color: white;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
            font-size: 14px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 25px;
            background: rgba(255,255,255,0.2);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .mode-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
        }

        .mode-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .start-btn {
            padding: 12px 40px;
            border: none;
            border-radius: 30px;
            background: #f093fb;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
        }

        .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(245, 87, 108, 0.5);
        }

        .start-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .stats {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            color: white;
            font-size: 16px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffd700;
        }

        .stat-label {
            font-size: 12px;
            opacity: 0.9;
            margin-top: 2px;
        }

        .grid-container {
            background: white;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        .grid {
            display: grid;
            gap: 8px;
        }

        .grid-3 {
            grid-template-columns: repeat(3, 100px);
        }

        .grid-4 {
            grid-template-columns: repeat(4, 85px);
        }

        .grid-5 {
            grid-template-columns: repeat(5, 75px);
        }

        .cell {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #333;
            background: linear-gradient(145deg, #f5f5f5, #ffffff);
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }

        .cell:hover:not(.disabled) {
            transform: scale(1.05);
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        .cell:active:not(.disabled) {
            transform: scale(0.95);
        }

        .cell.correct {
            background: linear-gradient(145deg, #4ade80, #22c55e);
            color: white;
            border-color: #16a34a;
        }

        .cell.wrong {
            background: linear-gradient(145deg, #f87171, #ef4444);
            color: white;
            border-color: #dc2626;
            animation: shake 0.4s;
        }

        .cell.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 350px;
            animation: popIn 0.3s;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-title {
            font-size: 24px;
            color: #333;
            margin-bottom: 15px;
        }

        .modal-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 20px 0;
        }

        .modal-stat {
            display: flex;
            flex-direction: column;
        }

        .modal-stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .modal-stat-label {
            font-size: 12px;
            color: #666;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .records {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 15px 25px;
            border-radius: 15px;
            color: white;
            max-width: 400px;
            width: 100%;
        }

        .records-title {
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
            opacity: 0.9;
        }

        .records-list {
            display: flex;
            justify-content: space-around;
            font-size: 13px;
        }

        .record-item {
            text-align: center;
        }

        .record-value {
            font-weight: bold;
            color: #ffd700;
            font-size: 16px;
        }

        @media (max-width: 500px) {
            .grid-3 { grid-template-columns: repeat(3, 80px); }
            .grid-4 { grid-template-columns: repeat(4, 70px); }
            .grid-5 { grid-template-columns: repeat(5, 60px); }
            .cell { font-size: 20px; }
        }
    </style>
</head>
<body>
    <h1>舒尔特方格</h1>
    <p class="subtitle">按顺序点击数字 1 到 N，挑战你的注意力极限！</p>

    <div class="controls">
        <button class="mode-btn active" data-size="3">3 × 3</button>
        <button class="mode-btn" data-size="4">4 × 4</button>
        <button class="mode-btn" data-size="5">5 × 5</button>
    </div>

    <div class="stats">
        <div class="stat-item">
            <span class="stat-value" id="timer">0.00</span>
            <span class="stat-label">秒</span>
        </div>
        <div class="stat-item">
            <span class="stat-value" id="current">-</span>
            <span class="stat-label">当前目标</span>
        </div>
    </div>

    <button class="start-btn" id="startBtn">开始游戏</button>

    <div class="grid-container">
        <div class="grid grid-3" id="grid"></div>
    </div>

    <div class="records">
        <div class="records-title">最佳纪录</div>
        <div class="records-list">
            <div class="record-item">
                <div class="record-value" id="best3">-</div>
                <div>3×3</div>
            </div>
            <div class="record-item">
                <div class="record-value" id="best4">-</div>
                <div>4×4</div>
            </div>
            <div class="record-item">
                <div class="record-value" id="best5">-</div>
                <div>5×5</div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title">挑战完成！</div>
            <div class="modal-stats">
                <div class="modal-stat">
                    <span class="modal-stat-value" id="modalTime">0.00</span>
                    <span class="modal-stat-label">秒</span>
                </div>
                <div class="modal-stat">
                    <span class="modal-stat-value" id="modalSize">3×3</span>
                    <span class="modal-stat-label">难度</span>
                </div>
            </div>
            <div style="display: flex; gap: 15px; justify-content: center;">
                <button class="modal-btn" id="modalBtnAgain" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">再玩一次</button>
                <button class="modal-btn" id="modalBtnBack" style="background: linear-gradient(135deg, #94a3b8 0%, #64748b 100%);">返回选择</button>
            </div>
        </div>
    </div>

    <script>
        class SchulteGrid {
            constructor() {
                this.size = 3;
                this.isPlaying = false;
                this.currentNumber = 1;
                this.startTime = null;
                this.timerInterval = null;
                this.records = this.loadRecords();

                this.elements = {
                    grid: document.getElementById('grid'),
                    timer: document.getElementById('timer'),
                    current: document.getElementById('current'),
                    startBtn: document.getElementById('startBtn'),
                    modal: document.getElementById('modal'),
                    modalTime: document.getElementById('modalTime'),
                    modalSize: document.getElementById('modalSize'),
                    modalBtnAgain: document.getElementById('modalBtnAgain'),
                    modalBtnBack: document.getElementById('modalBtnBack')
                };

                this.init();
            }

            init() {
                this.bindEvents();
                this.updateRecordsDisplay();
                this.resetGrid();
            }

            bindEvents() {
                // 模式切换
                document.querySelectorAll('.mode-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        if (this.isPlaying) return;
                        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                        e.target.classList.add('active');
                        this.size = parseInt(e.target.dataset.size);
                        this.resetGrid();
                    });
                });

                // 开始按钮
                this.elements.startBtn.addEventListener('click', () => {
                    if (this.isPlaying) {
                        this.stopGame();
                    } else {
                        this.startGame();
                    }
                });

                // 弹窗按钮 - 再玩一次
                this.elements.modalBtnAgain.addEventListener('click', () => {
                    this.elements.modal.classList.remove('show');
                    this.startGame();
                });

                // 弹窗按钮 - 返回选择
                this.elements.modalBtnBack.addEventListener('click', () => {
                    this.elements.modal.classList.remove('show');
                    this.resetGrid();
                });

                // 键盘支持
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.elements.startBtn.click();
                    }
                });
            }

            resetGrid() {
                this.elements.grid.className = `grid grid-${this.size}`;
                this.elements.grid.innerHTML = '';
                this.isPlaying = false;
                this.currentNumber = 1;
                this.stopTimer();
                this.elements.timer.textContent = '0.00';
                this.elements.current.textContent = '-';
                this.elements.startBtn.textContent = '开始游戏';
                this.elements.startBtn.disabled = false;

                const totalCells = this.size * this.size;
                for (let i = 1; i <= totalCells; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = i;
                    cell.dataset.number = i;
                    cell.addEventListener('click', () => this.handleCellClick(cell));
                    this.elements.grid.appendChild(cell);
                }
            }

            shuffleGrid() {
                const cells = Array.from(this.elements.grid.children);
                const numbers = cells.map(c => parseInt(c.dataset.number));

                // Fisher-Yates 洗牌算法
                for (let i = numbers.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
                }

                cells.forEach((cell, index) => {
                    cell.textContent = numbers[index];
                    cell.dataset.number = numbers[index];
                    cell.className = 'cell';
                    cell.style.visibility = 'visible';
                });
            }

            startGame() {
                this.shuffleGrid();
                this.isPlaying = true;
                this.currentNumber = 1;
                this.elements.current.textContent = '1';
                this.elements.startBtn.textContent = '停止';
                this.startTime = Date.now();
                this.startTimer();
            }

            stopGame() {
                this.isPlaying = false;
                this.stopTimer();
                this.elements.startBtn.textContent = '开始游戏';
                this.elements.current.textContent = '-';
            }

            startTimer() {
                this.timerInterval = setInterval(() => {
                    const elapsed = (Date.now() - this.startTime) / 1000;
                    this.elements.timer.textContent = elapsed.toFixed(2);
                }, 50);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
            }

            handleCellClick(cell) {
                if (!this.isPlaying) return;
                if (cell.classList.contains('correct')) return;

                const number = parseInt(cell.dataset.number);

                if (number === this.currentNumber) {
                    // 正确
                    cell.classList.add('correct');
                    this.currentNumber++;

                    const totalCells = this.size * this.size;
                    if (this.currentNumber > totalCells) {
                        this.gameComplete();
                    } else {
                        this.elements.current.textContent = this.currentNumber;
                    }
                } else {
                    // 错误
                    cell.classList.add('wrong');
                    setTimeout(() => {
                        cell.classList.remove('wrong');
                    }, 400);
                }
            }

            gameComplete() {
                this.isPlaying = false;
                this.stopTimer();
                const finalTime = parseFloat(this.elements.timer.textContent);

                // 保存记录
                this.saveRecord(this.size, finalTime);

                // 显示结果
                this.elements.modalTime.textContent = finalTime.toFixed(2);
                this.elements.modalSize.textContent = `${this.size}×${this.size}`;
                this.elements.modal.classList.add('show');

                this.elements.startBtn.textContent = '开始游戏';
                this.elements.current.textContent = '-';
            }

            loadRecords() {
                const saved = localStorage.getItem('schulteRecords');
                return saved ? JSON.parse(saved) : { 3: null, 4: null, 5: null };
            }

            saveRecord(size, time) {
                if (!this.records[size] || time < this.records[size]) {
                    this.records[size] = time;
                    localStorage.setItem('schulteRecords', JSON.stringify(this.records));
                    this.updateRecordsDisplay();
                }
            }

            updateRecordsDisplay() {
                [3, 4, 5].forEach(size => {
                    const el = document.getElementById(`best${size}`);
                    const record = this.records[size];
                    el.textContent = record ? record.toFixed(2) + 's' : '-';
                });
            }
        }

        // 初始化游戏
        document.addEventListener('DOMContentLoaded', () => {
            new SchulteGrid();
        });
    </script>
</body>
</html>
