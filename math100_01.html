<header class="top"><small>PLAY · THINK · DISCOVER</small><h1>小学数学思维训练100课</h1><p>从看得见、说得清，到想得深、用得活。每天15–20分钟，和孩子一起学会思考。</p><div class="stats"><div class="stat"><b id="doneCount">0/100</b><span>已完成课程</span></div><div class="stat"><b id="percent">0%</b><span>总体进度</span></div><div class="stat"><b id="moduleCount">0/10</b><span>完成模块</span></div></div></header>
<div class="layout"><aside class="side"><h3>课程目录 · 10个模块</h3><div class="modulewrap" id="modules"></div><div class="toolbar"><button onclick="resetProgress()">重置学习进度</button></div></aside><main class="maincard"><div id="courseView"><div class="crumb">学习中心 / <span id="crumbModule">画图</span></div><div class="hero"><div><h2 id="moduleTitle">01 · 画图思维</h2><p id="moduleDesc"></p></div><span class="pill" id="moduleLevel">基础表达</span></div><div class="progressbar"><span id="moduleBar"></span></div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px"><span>本模块学习进度</span><span id="moduleProgress">0/10课</span></div><div class="lessonlist" id="lessons"></div></div><div id="lessonView" class="lessonview"></div></main></div><div class="footer">建议家长陪伴引导 · 鼓励孩子画一画、说一说、试一试。答错不是失败，解释思路才是重点。</div>
<script>
const modules=[
{name:'画图',tag:'直观表达',desc:'把文字条件变成图形、圆圈或线段，让数量关系看得见。',aim:'能用图表示数量、变化和简单关系。',titles:['用圆圈表示数量','画图解决加法问题','画图解决减法问题','比较两个数量','认识“多几个”','认识“少几个”','用线段表示总数','用线段表示相差','画图分步解决两步题','自己选择图来解题'],ex:['桌上有3个红球和2个蓝球，一共有几个球？','小雨有4张贴纸，又得到3张，现在有几张？','盘子里有8颗葡萄，吃掉2颗，还剩几颗？','小华有6支笔，小林有4支，谁多？多几个？','姐姐有7本书，弟弟有5本，姐姐多几本？','树上有9只鸟，飞走3只，还剩几只？','一盒彩笔有5支红色和4支蓝色，共有几支？','小明有8颗糖，小红有6颗，相差几颗？','花园有5朵红花，黄花比红花多2朵，又新开3朵黄花，现在黄花几朵？','小刚有7个积木，送给朋友2个，又收到4个，画图算现在有几个？'],q:['3+2等于几？','4+3等于几？','8-2等于几？','6和4相差几？','7-5等于几？','9-3等于几？','5+4等于几？','8-6等于几？','5+2+3等于几？','7-2+4等于几？'],a:[5,7,6,2,2,6,9,2,10,9],opts:[[4,5,6],[6,7,8],[5,6,7],[1,2,3],[1,2,3],[5,6,7],[8,9,10],[1,2,3],[9,10,11],[8,9,10]],steps:'先读题，圈出数量；再选择合适的图；最后根据图中的数量关系列式。'},
{name:'列表',tag:'整理信息',desc:'把条件按行、列整理，逐项比较，避免信息混乱或遗漏。',aim:'能用简单表格记录条件和结果。',titles:['把物品分类记在表里','用表格记录数量','比较两组数据','整理价格信息','记录不同搭配','按顺序填写表格','从表格中找答案','补全缺少的信息','用列表解决搭配题','自己设计一张表'],ex:['红积木3块、蓝积木2块，用表格记录后求总数。','小明周一读2页，周二读3页，合计读几页？','一班有8个男生、6个女生，哪组人数多？','铅笔2元，橡皮3元，买两样要多少钱？','上衣有红、蓝两种，裤子有黑、白两种，有几种搭配？','按1、2、3的顺序记录三天收集的树叶数：2、4、3片。','表格记录苹果4个、梨5个，水果一共有几个？','红球有3个，比蓝球少2个，蓝球有几个？','饮料有牛奶和果汁，点心有面包和蛋糕，能搭配几种？','自己做一张家庭成员最喜欢水果的统计表。'],q:['3+2等于几？','2+3等于几？','8和6相差几？','2+3等于几？','2种上衣配2种裤子有几种？','2+4+3等于几？','4+5等于几？','3+2等于几？','2×2种搭配共有几种？','统计表最重要的是？'],a:[5,5,2,5,4,9,9,5,4,1],opts:[[4,5,6],[4,5,6],[1,2,3],[4,5,6],[3,4,5],[8,9,10],[8,9,10],[4,5,6],[3,4,5],[0,1,2]],steps:'先确定表格要记录什么，再把每条信息放到对应位置，最后横向或纵向比较。'},
{name:'枚举',tag:'有序寻找',desc:'把可能的情况一项一项列出来，按顺序、不重复、不遗漏。',aim:'学会固定一个条件，再依次改变另一个条件。',titles:['找出所有可能','按顺序列数字','组成两位数','固定十位来枚举','搭配衣服','搭配早餐','找出不同路线','列出加法分拆','数一数组合数量','检查有没有遗漏'],ex:['从红、黄两种颜色中选一种，有几种选法？','用数字1、2组成两位数，数字不重复。','用1、2、3组成不同的两位数，不能重复。','十位固定为1，个位可用2或3，可以组成哪些数？','两件上衣、两条裤子，可以搭配几套？','牛奶或豆浆配面包或鸡蛋，有几种早餐？','从家到公园有2条路，公园到学校有2条路，路线组合有几种？','把5分成两个不为0的整数，有哪些分法（不计顺序）？','用0和1两张卡片排成两位数，可以组成几个？','用1、2、3组成两位数且不重复，一共有几个？'],q:['有几种颜色选择？','能组成几个数？','能组成几个两位数？','固定十位为1，有几个数？','2件上衣配2条裤子有几套？','2种饮品配2种食物有几种？','2条路再接2条路有几种路线？','5可分成几组（不计顺序）？','0不能放在十位，能组成几个两位数？','1、2、3组成不重复两位数有几个？'],a:[2,2,6,2,4,4,4,2,1,6],opts:[[1,2,3],[1,2,3],[4,5,6],[1,2,3],[3,4,5],[3,4,5],[3,4,5],[1,2,3],[1,2,3],[5,6,7]],steps:'先确定一个位置或条件，再逐个列出其余可能；每列完一组就做标记，最后检查是否重复或遗漏。'},
{name:'分类讨论',tag:'分情况想',desc:'根据题目中的不同情况分组，再分别解决，最后合并结果。',aim:'能说清分类标准，并检查分类是否完整。',titles:['按颜色分类','按形状分类','按大小分类','按奇偶初步分类','分清有无条件','两种情况分别想','分类整理图形','分类解决生活题','多条件分类','检查分类是否完整'],ex:['把红、蓝、红、黄三支彩笔按颜色分类。','把圆形、三角形、正方形分组。','把大球和小球分别数一数。','把数字2、3、4、5分成两组：单数和双数。','盒子里只可能有红球或蓝球，拿出一个会是什么？','今天可能下雨也可能不下雨，出门要考虑哪两种情况？','三角形和四边形各有几个？','水果分成带皮和不带皮两类，苹果、香蕉、葡萄怎么分？','有红蓝两色帽子和大小两种尺寸，共有几类帽子？','把1到5分成奇数和偶数，是否每个数都分到了？'],q:['红色彩笔有几支？','三种不同形状可以分成几类？','大球和小球是按什么分类？','2、3、4、5中单数有几个？','两种可能情况一共有几种？','两种天气情况共有几种？','三角形和四边形属于几类？','分类时最重要的是？','2种颜色和2种尺寸可分几类？','1到5中偶数有几个？'],a:[2,3,2,2,2,2,2,1,4,2],opts:[[1,2,3],[2,3,4],[1,2,3],[1,2,3],[1,2,3],[1,2,3],[1,2,3],[0,1,2],[3,4,5],[1,2,3]],steps:'先说出按什么标准分类，再把每种情况分别列出，最后检查每个对象是否都被分到且没有重复。'},
{name:'分析',tag:'从问题出发',desc:'先看问题要求什么，再倒着想需要哪些信息，逐步找到解题入口。',aim:'能从问题反推所需条件。',titles:['先找题目问什么','找出解决问题的条件','求总数需要什么','求剩余需要什么','求相差需要什么','理解“比多”','理解“比少”','两步题倒着想','补充缺少的条件','自己提出解题问题'],ex:['小乐有4颗糖，又得到2颗，题目问什么？','要知道两盒彩笔一共有多少，需要知道什么？','小明有3本书，小红有5本，求总数需要哪些数？','篮子里有8个梨，拿走一些后还剩5个，要求拿走几个需要什么？','小红有7张卡，小明有4张，求相差要怎么想？','哥哥有9岁，比弟弟大2岁，求弟弟年龄需要什么关系？','小明有6支笔，比小红少2支，求小红有几支？','小明有5元，买书花2元，剩下的钱又买橡皮，要求最后剩余需知道什么？','小明和小红共有10颗糖，小明有6颗，求小红还缺哪个条件？','小明有3个球，小红有5个球，你能提出一个数学问题吗？'],q:['读题第一步通常先找什么？','求两组数量总和需要知道什么？','3本和5本合起来是多少？','8-5等于几？','7-4等于几？','9-2等于几？','6+2等于几？','5-2等于几？','还需要知道小明有多少颗吗？'],a:[1,1,8,3,3,7,8,3,0],opts:[[0,1,2],[0,1,2],[7,8,9],[2,3,4],[2,3,4],[6,7,8],[7,8,9],[2,3,4],[0,1,2]],steps:'读完题先用自己的话说“要求什么”；再问“要得到这个答案，我必须知道什么”；最后检查题目是否提供了这些条件。'},
{name:'综合',tag:'逐步推理',desc:'从已知条件出发，一步一步得到新的信息，再解决最终问题。',aim:'能把多条条件串成连续的推理过程。',titles:['从一个条件开始','连续增加数量','连续减少数量','先求中间量','两步加法问题','加减混合问题','多个角色比较','整理推理顺序','解决生活中的两步题','完整讲述解题过程'],ex:['小明有4个球，已知条件是什么？','小明有3颗糖，又得到2颗，再得到1颗。','有9个气球，先送出2个，又送出3个。','小红有4本书，小明比她多3本，小明有几本？','树上有5只鸟，又飞来3只，再飞来2只。','小华有8元，买文具花3元，又得到2元。','小明比小红高，小红比小刚高，谁最高？','先有6个苹果，拿走2个，再放入4个，按顺序算。','车上有7人，下车2人，上车3人，现在几人？','用“已知—先求—再求”讲解一道两步题。'],q:['已知小明有几个球？','3+2+1等于几？','9-2-3等于几？','4+3等于几？','5+3+2等于几？','8-3+2等于几？','三人中谁最高？','6-2+4等于几？','7-2+3等于几？','两步题应怎样表达过程？'],a:[4,6,4,7,10,7,1,8,8,1],opts:[[3,4,5],[5,6,7],[3,4,5],[6,7,8],[9,10,11],[6,7,8],[0,1,2],[7,8,9],[7,8,9],[0,1,2]],steps:'每得到一个新结果，就把它作为下一步的已知条件；不要跳步，最后回到问题检查是否回答完整。'},
{name:'归纳',tag:'发现规律',desc:'观察几个例子，比较它们的变化，找到共同规律并预测下一步。',aim:'能描述规律，而不只是猜答案。',titles:['每次增加几个','每次减少几个','重复图形规律','颜色交替规律','数字跳着数','数量逐步变化','找出重复周期','发现简单递增规律','解释规律的理由','自己编一个规律'],ex:['2、4、6、8，后面一个数是多少？','10、8、6、4，后面一个数是多少？','圆、方、圆、方，接下来是什么？','红、蓝、红、蓝，接下来是什么颜色？','5、10、15、20，接下来是多少？','1个点、2个点、3个点，下一组几个点？','太阳、月亮、星星、太阳、月亮，接下来是什么？','1、3、6、10，接下来增加几个？','3、6、9、12，为什么下一个是15？','自己设计一个每次增加2的数字规律。'],q:['2、4、6、8后面是？','10、8、6、4后面是？','圆、方、圆、方后面是？','红、蓝、红、蓝后面是什么？','5、10、15、20后面是？','1、2、3后面是？','太阳、月亮、星星重复，接下来是？','1、3、6、10下一个数是？','3、6、9、12下一个数是？','每次增加2，4后面是？'],a:[10,2,1,1,25,4,3,15,15,6],opts:[[9,10,11],[1,2,3],[0,1,2],[0,1,2],[20,25,30],[3,4,5],[1,2,3],[14,15,16],[14,15,16],[5,6,7]],steps:'把相邻两项放在一起比较，观察“变了什么、变了多少、是否重复”，再用一句话说出规律。'},
{name:'数形结合',tag:'数字与图形',desc:'用点子、方格、积木和线段理解数的组成、运算和空间关系。',aim:'能把数字关系转化为图形，也能从图形读出数量。',titles:['点子图数数量','数字拆分与合成','认识十格框','凑十法','用图理解减法','数线上的位置','用方格比较多少','图形中的数量规律','用图解决简单应用题','数字和图形互相转换'],ex:['两排点分别有3个和2个，一共有几个？','把7分成两个数，可以怎样分？','十格框里已经放了6个点，还差几个满十？','9+4怎样先凑成10？','画8个点，划掉3个，还剩几个？','数线上从2向右走3格，到了几？','两行方格分别有5格和3格，哪行多？','每个正方形用4根小棒，2个分开摆需要几根？','小明有5个红球、3个蓝球，用图表示总数。','用6个点摆成两行，每行3个，可以写出什么加法？'],q:['3+2等于几？','7可以分成3和几？','10-6等于几？','9+4等于几？','8-3等于几？','2向右走3格到几？','5比3多几格？','4+4等于几？','5+3等于几？','3+3等于几？'],a:[5,4,4,13,5,5,2,8,8,6],opts:[[4,5,6],[3,4,5],[3,4,5],[12,13,14],[4,5,6],[4,5,6],[1,2,3],[7,8,9],[7,8,9],[5,6,7]],steps:'先动手摆点子或积木，再把每一组数量标出来，最后把图形对应成算式。'},
{name:'方程',tag:'未知数意识',desc:'用方框代表不知道的数，理解等量关系；低年级先不要求正式代数运算。',aim:'能根据文字关系写出简单的□算式。',titles:['认识未知数方框','□加几等于几','□减几等于几','几加□等于几','等量关系要平衡','用方框表示故事','连续一步找未知数','用逆运算求未知数','比较两种表达','自己编未知数问题'],ex:['□里藏着一个数，□+2=5，是多少？','□+3=8，方框里是多少？','□-2=5，方框里是多少？','4+□=9，方框里是多少？','天平左边3个方块，右边□个方块一样重，□是多少？','小红原来有一些贴纸，又得到2张，现在有6张。','一个数加4等于9，这个数是多少？','□+5=12，可以用什么方法求□？','“一个数比4多3”和“□-4=3”表达一样吗？','自己编一个答案是6的方框题。'],q:['□+2=5，□是几？','□+3=8，□是几？','□-2=5，□是几？','4+□=9，□是几？','3和几一样多？','□+2=6，□是几？','□+4=9，□是几？','□+5=12，□是几？','4+3等于几？','6-□=2，□是几？'],a:[3,5,7,5,3,4,5,7,7,4],opts:[[2,3,4],[4,5,6],[6,7,8],[4,5,6],[2,3,4],[3,4,5],[4,5,6],[6,7,8],[6,7,8],[3,4,5]],steps:'把□当作一个暂时不知道的数。想一想：什么数放进去，等式两边才相等？可以用实物、数线或逆运算验证。'},
{name:'转化与化归',tag:'换个角度',desc:'把陌生或稍难的问题，转成已经熟悉的数量关系、图形或简单算式。',aim:'能发现“可以变成哪道会做的题”。',titles:['把数字拆开算','凑整再计算','把减法变成加法想','把大问题分成小问题','移动一个数量使相等','替换成熟悉的图形','从复杂步骤中找简单关系','改变观察角度','一题多种转化','自己说出转化方法'],ex:['8+5可以把5拆成2和3，先凑十。','19+6可以先算20+6再减1。','10-7可以想7+几=10。','一共有10个积木，红色4个，蓝色几个？','小明8颗糖，小红6颗，怎样让一样多？','把一排6个点看成3组，每组几个？','连续算5+3+2，可以先把哪两个数合起来？','从不同方向看同一个积木塔，看到的数量可能不同。','计算9+7，先凑十和拆成10+6两种想法。','把一个难题改写成你熟悉的加减法。'],q:['8+5等于几？','19+6等于几？','10-7等于几？','10-4等于几？','8和6相差几？','6个点分成3组，每组几个？','5+3+2等于几？','从正面和侧面看物体，看到的形状一定一样吗？','9+7等于几？','转化的意思是？'],a:[13,25,3,6,2,2,10,0,16,1],opts:[[12,13,14],[24,25,26],[2,3,4],[5,6,7],[1,2,3],[1,2,3],[9,10,11],[0,1,2],[15,16,17],[0,1,2]],steps:'先找出题目中熟悉的部分，再把陌生问题拆开、凑整、换一种表示或改写成会做的题。'}
];
const lessonNames=['认识方法','看懂例题','跟着做一做','独立练习','换个情境','找出关键条件','提高挑战','说出理由','综合运用','小小闯关'];
let current=0, selected=null, chosen=null, checked=false;let completed=JSON.parse(localStorage.getItem('math100done')||'[]');let scores=JSON.parse(localStorage.getItem('math100scores')||'{}');
function save(){localStorage.setItem('math100done',JSON.stringify(completed));localStorage.setItem('math100scores',JSON.stringify(scores));renderStats()}
function renderStats(){document.getElementById('doneCount').textContent=completed.length+'/100';document.getElementById('percent').textContent=Math.round(completed.length)+'%';document.getElementById('moduleCount').textContent=modules.filter((m,i)=>completed.filter(x=>x.startsWith(i+'-')).length===10).length+'/10'}
function renderModules(){document.getElementById('modules').innerHTML=modules.map((m,i)=>`<button class="module ${i===current?'active':''}" onclick="openModule(${i})"><span class="num">${String(i+1).padStart(2,'0')}</span><span class="mtext">${m.name}<small>${m.tag}</small></span><span class="count">${completed.filter(x=>x.startsWith(i+'-')).length}/10</span></button>`).join('')}
function openModule(i){current=i;document.getElementById('courseView').style.display='block';document.getElementById('lessonView').classList.remove('show');renderModules();renderCourse();}
function renderCourse(){let m=modules[current],done=completed.filter(x=>x.startsWith(current+'-')).length;document.getElementById('crumbModule').textContent=m.name;document.getElementById('moduleTitle').textContent=String(current+1).padStart(2,'0')+' · '+m.name+'思维';document.getElementById('moduleDesc').textContent=m.desc+' '+m.aim;document.getElementById('moduleLevel').textContent=m.tag;document.getElementById('moduleBar').style.width=(done*10)+'%';document.getElementById('moduleProgress').textContent=done+'/10课';document.getElementById('lessons').innerHTML=m.titles.map((t,j)=>{let id=current+'-'+j,d=completed.includes(id);return `<button class="lesson ${d?'done':''}" onclick="openLesson(${current},${j})"><span class="ln">${String(j+1).padStart(2,'0')}</span><span><strong>${t}</strong><small>${lessonNames[j]} · 约15分钟</small></span>${d?'<span class="tick">✓</span>':''}</button>`}).join('')}
function openLesson(mi,li){current=mi;selected=li;chosen=null;checked=false;let m=modules[mi],id=mi+'-'+li,question=m.q[li],opts=m.opts[li];document.getElementById('courseView').style.display='none';let v=document.getElementById('lessonView');v.classList.add('show');let level=li<3?'基础':li<7?'提高':'进阶';v.innerHTML=`<button class="back" onclick="backToCourse()">← 返回课程目录</button><div class="crumb">${m.name}思维 / 第${li+1}课</div><div class="hero"><div><h2>${String(mi*10+li+1).padStart(2,'0')} · ${m.titles[li]}</h2><p>${m.aim}</p></div><span class="pill">${level}</span></div><div class="section"><h3>🎯 本课目标</h3><p>学会${m.name}方法中的“${m.titles[li]}”，尝试用自己的话说出思考过程。</p></div><div class="section prompt"><h3>📝 本课题目</h3><p style="font-size:19px;font-weight:650;line-height:1.8;color:#243247">${m.ex[li]}</p><p style="margin-top:12px;color:#718096">${question}</p><div id="options">${opts.map((n,k)=>`<button class="quizopt" id="opt${k}" onclick="choose(${k})">${['A','B','C'][k]} · ${n}</button>`).join('')}</div><button class="action" id="checkBtn" onclick="checkAnswer()">提交答案，查看解析</button><div id="feedback"></div></div><div class="section prompt"><h3>💬 家长引导语</h3><p>先让孩子独立思考，可以画图、摆积木或口头说明。提交答案后，再一起阅读解析。不要急着告诉孩子答案，鼓励孩子说出“为什么”。</p></div><div class="toolbar"><button onclick="prevLesson()">上一课</button><button onclick="nextLesson()">下一课 →</button><button onclick="backToCourse()">回到本模块</button></div>`;renderModules()}
function choose(k){if(checked)return;chosen=k;document.querySelectorAll('.quizopt').forEach((b,i)=>b.classList.toggle('selected',i===k))}
function checkAnswer(){if(chosen===null){document.getElementById('feedback').innerHTML='<div class="feedback">请先选择一个答案，再提交。</div>';return}let m=modules[current],right=m.opts[selected][chosen]===m.a[selected],id=current+'-'+selected;checked=true;document.querySelectorAll('.quizopt').forEach((b,i)=>{if(m.opts[selected][i]===m.a[selected])b.classList.add('correct');else if(i===chosen)b.classList.add('wrong')});if(right&&!completed.includes(id))completed.push(id);scores[id]=right?1:0;save();document.getElementById('checkBtn').disabled=true;document.getElementById('feedback').innerHTML=`<div class="feedback"><h3 style="margin:0 0 8px">${right?'回答正确，真棒！':'再想一想，看看解析。'}</h3><p><b>正确答案：${m.a[selected]}</b></p><p><b>思考方法：</b>${m.steps}</p><p><b>解析：</b>先回到题目，找出已知条件和要求的问题；再按照“${m.name}”的方法整理信息。${m.ex[selected]} 本题应选择 ${m.a[selected]}。可以让孩子再用自己的话讲一遍解题过程，或用画图、摆实物的方式验证。</p><p style="color:#557064;margin-bottom:0">${right?'本课已计入完成进度。':'本次答案不正确，但可以通过解析重新理解；本课仍可继续学习。'}</p></div>`}
function backToCourse(){document.getElementById('courseView').style.display='block';document.getElementById('lessonView').classList.remove('show');renderModules();renderCourse()}
function prevLesson(){if(selected>0)openLesson(current,selected-1);else if(current>0)openLesson(current-1,9)}function nextLesson(){if(selected<9)openLesson(current,selected+1);else if(current<9)openLesson(current+1,0);else backToCourse()}
function resetProgress(){if(confirm('确定清除本设备保存的学习进度吗？')){completed=[];scores={};save();renderModules();renderCourse()}}
renderStats();renderModules();renderCourse();
</script></body></html>
